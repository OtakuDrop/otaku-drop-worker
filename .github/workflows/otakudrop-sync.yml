name: OtakuDrop inventory sync

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_TABLE: merchandise_drops
      RUN_ONCE: "true"
      AMIAMI_ENABLED: ${{ vars.AMIAMI_ENABLED }}
      AMIAMI_ENDPOINT: ${{ vars.AMIAMI_ENDPOINT }}
      AMIAMI_KEYWORDS: ${{ vars.AMIAMI_KEYWORDS }}
      MANDARAKE_ENABLED: ${{ vars.MANDARAKE_ENABLED }}
      MANDARAKE_ENDPOINT: ${{ vars.MANDARAKE_ENDPOINT }}
      MANDARAKE_KEYWORDS: ${{ vars.MANDARAKE_KEYWORDS }}
      MANDARAKE_SORT: ${{ vars.MANDARAKE_SORT }}
      MANDARAKE_CATEGORY: ${{ vars.MANDARAKE_CATEGORY }}
      SURUGAYA_ENABLED: ${{ vars.SURUGAYA_ENABLED }}
      SURUGAYA_ENDPOINT: ${{ vars.SURUGAYA_ENDPOINT }}
      SURUGAYA_KEYWORDS: ${{ vars.SURUGAYA_KEYWORDS }}
      SURUGAYA_CATEGORY: ${{ vars.SURUGAYA_CATEGORY }}
      SOURCE_DELAY_MIN_SECONDS: "3"
      SOURCE_DELAY_MAX_SECONDS: "7"
      LOG_LEVEL: INFO

    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run inventory sync once
        run: python -m otakudrop_sync.runner
